    <rect x="77" y="50" width="14" height="84" rx="7" fill="#fff" stroke="#3d3935" stroke-width="2"/>
    <circle cx="84" cy="144" r="14" fill="#fff" stroke="#3d3935" stroke-width="2"/>
    <circle cx="84" cy="144" r="9" fill="#e8604c"/>
    <rect class="thermo-fill" x="80.5" y="56" width="7" height="84" rx="3.5" fill="#e8604c" style="transform-box:fill-box;transform-origin:bottom"/>
    <line x1="92" y1="71" x2="97" y2="71" stroke="#3d3935" stroke-width="1.6"/><line x1="92" y1="92" x2="97" y2="92" stroke="#3d3935" stroke-width="1.6"/><line x1="92" y1="113" x2="97" y2="113" stroke="#3d3935" stroke-width="1.6"/>
  </g>
  <g class="check">
