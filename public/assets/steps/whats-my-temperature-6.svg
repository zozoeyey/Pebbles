<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .thermo-fill { animation: drop 3.4s ease-in-out infinite; }
  @keyframes drop { 0%,15% { transform: scaleY(.85);} 55%,100% { transform: scaleY(.2);} }
  .check { animation: ck 3.4s ease-in-out infinite; opacity:0; }
  @keyframes ck { 0%,55% { opacity:0; transform: scale(.5);} 68%,95% { opacity:1; transform: scale(1);} 100% {opacity:0;} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
