<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .sharer { animation: talk 2.6s ease-in-out infinite; }
  @keyframes talk { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-4px);} }
  .sb { animation: sbp 2.6s ease-in-out infinite; }
  @keyframes sbp { 0%,100% { transform: scale(.95); opacity:.75;} 50% { transform: scale(1); opacity:1;} }

</style>
