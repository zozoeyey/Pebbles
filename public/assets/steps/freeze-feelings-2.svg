<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .arc { animation: pulse 1.4s ease-out infinite; }
  .a2 { animation-delay: .25s; }
  @keyframes pulse { 0% {opacity:0; transform: translateX(-4px);} 40% {opacity:1;} 100% {opacity:0; transform: translateX(6px);} }

</style>
