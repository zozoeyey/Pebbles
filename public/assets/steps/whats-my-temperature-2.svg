<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .thermo-fill { animation: updown 4s ease-in-out infinite; }
  @keyframes updown { 0%,100% { transform: scaleY(.15);} 50% { transform: scaleY(.95);} }
  .coolb { animation: cw 4s ease-in-out infinite; }
  @keyframes cw { 0%,10%,90%,100% { transform: scale(1.12);} 45%,60% { transform: scale(.92);} }
  .hotb { animation: hw 4s ease-in-out infinite; }
  @keyframes hw { 0%,10%,90%,100% { transform: scale(.92);} 45%,60% { transform: scale(1.12) rotate(4deg);} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
