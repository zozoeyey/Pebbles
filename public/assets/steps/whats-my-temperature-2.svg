   <path d="M48.94117647058823 75.3 q2.3529411764705883 -2.9411764705882355 4.705882352941177 0" stroke="#3d3935" stroke-width="1.5294117647058825" fill="none" stroke-linecap="round"/><path d="M42.470588235294116 83.04 q3.5294117647058822 3.5294117647058822 7.0588235294117645 0" stroke="#3d3935" stroke-width="1.411764705882353" fill="none" stroke-linecap="round"/>
