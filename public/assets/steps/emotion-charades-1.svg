<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .slip { animation: fall 2.8s ease-in infinite; }
  .s2 { animation-delay: 1s; }
  @keyframes fall { 0% { transform: translateY(-14px) rotate(0); opacity:0;} 20% { opacity:1;} 55% { transform: translateY(52px) rotate(14deg); opacity:1;} 62%,100% { opacity:0; transform: translateY(52px);} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  <path d="M52 118 a48 30 0 0 0 96 0 z" fill="#9CD3F8" stroke="#3d3935" stroke-width="2.4"/>
  <g class="slip s1"><rect x="72" y="46" width="26" height="16" rx="3" fill="#fff" stroke="#3d3935" stroke-width="1.8"/></g>
  <g class="slip s2"><rect x="104" y="38" width="26" height="16" rx="3" fill="#fff" stroke="#3d3935" stroke-width="1.8" transform="rotate(12 117 46)"/></g>

</svg>