<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .puffer { animation: pfr 2.4s ease-in-out infinite; }
  @keyframes pfr { 0%,20% { transform: scale(1);} 30% { transform: scale(1.14) translateX(4px);} 40%,100% { transform: scale(1);} }
  .popb { animation: popb 2.4s ease-in infinite; }
  @keyframes popb { 0%,25% { opacity:0; transform: scale(.2);} 35%,48% { opacity:1; transform: scale(1);} 52%,100% { opacity:0;} }
  .burst { animation: bst 2.4s ease-out infinite; opacity:0; }
  @keyframes bst { 0%,50% {opacity:0; transform: scale(.6);} 56%,70% {opacity:1; transform: scale(1.1);} 80%,100% {opacity:0;} }
  .popt { animation: bst 2.4s ease-out infinite; opacity:0; }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
  <g class="puffer" style="transform-box:fill-box;transform-origin:center">
