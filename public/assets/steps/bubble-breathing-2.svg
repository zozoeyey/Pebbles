   <ellipse cx="65.41176470588235" cy="126.25" rx="2.635294117647059" ry="4.117647058823529" fill="#3d3935"/>
  </g>
  <circle class="popb" cx="126" cy="112" r="20" fill="none" stroke="#9CD3F8" stroke-width="3"/>
