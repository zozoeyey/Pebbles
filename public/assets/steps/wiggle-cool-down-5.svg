<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .inout { animation: io 5s ease-in-out infinite; }
  @keyframes io { 0%,100% { transform: scale(.94);} 40%,55% { transform: scale(1.12);} }
  .in { animation: lin 5s ease-in-out infinite; }
  .out { animation: lout 5s ease-in-out infinite; opacity:0; }
  @keyframes lin { 0%,40% {opacity:1;} 55%,100% {opacity:0;} }
  @keyframes lout { 0%,40% {opacity:0;} 55%,95% {opacity:1;} 100% {opacity:0;} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
  <g class="inout" style="transform-box:fill-box;transform-origin:center">
    <ellipse cx="100" cy="122" rx="36" ry="32" fill="#FDD15E"/>
    <ellipse cx="90.47058823529412" cy="117.2" rx="3.3882352941176475" ry="5.294117647058823" fill="#3d3935"/>
   <ellipse cx="109.52941176470588" cy="117.2" rx="3.3882352941176475" ry="5.294117647058823" fill="#3d3935"/>
  </g>
  <text class="lbl in" x="42" y="70" font-family="Montserrat,sans-serif" font-weight="700" font-size="13" fill="#3d3935">in…</text>
  <text class="lbl out" x="132" y="70" font-family="Montserrat,sans-serif" font-weight="700" font-size="13" fill="#3d3935">out…</text>

</svg>