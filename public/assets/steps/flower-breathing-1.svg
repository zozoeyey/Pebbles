<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .petals { animation: bloom 3.6s ease-in-out infinite; }
  @keyframes bloom { 0% { transform: scale(.2) rotate(-40deg);} 55%,80% { transform: scale(1) rotate(0);} 100% { transform: scale(.2) rotate(-40deg);} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
  <g class="bloom" style="transform-box:fill-box;transform-origin:center">
    <rect x="97.75" y="118" width="4.5" height="39" rx="2.25" fill="#7da84c"/>
    <path d="M100 136 q-15 3 -13.5 12 q12 1.5 13.5 -12" fill="#7da84c"/>
    <g class="petals" style="transform-box:fill-box;transform-origin:center">
      <ellipse cx="100" cy="104.5" rx="7.5" ry="13.5" fill="#F9A3C4" transform="rotate(0 100 118)"/><ellipse cx="100" cy="104.5" rx="7.5" ry="13.5" fill="#F9A3C4" transform="rotate(60 100 118)"/><ellipse cx="100" cy="104.5" rx="7.5" ry="13.5" fill="#F9A3C4" transform="rotate(120 100 118)"/><ellipse cx="100" cy="104.5" rx="7.5" ry="13.5" fill="#F9A3C4" transform="rotate(180 100 118)"/><ellipse cx="100" cy="104.5" rx="7.5" ry="13.5" fill="#F9A3C4" transform="rotate(240 100 118)"/><ellipse cx="100" cy="104.5" rx="7.5" ry="13.5" fill="#F9A3C4" transform="rotate(300 100 118)"/>
      <circle cx="100" cy="118" r="8.25" fill="#FDD15E"/>
    </g>
  </g>

</svg>