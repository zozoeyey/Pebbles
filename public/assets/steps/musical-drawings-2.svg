    stroke="#F9A3C4" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="200" stroke-dashoffset="200"/>
  
  <g class="mn1" style="transform-box:fill-box;transform-origin:center">
    <ellipse cx="58" cy="54" rx="4" ry="3.2" fill="#3d3935"/>
    <rect x="60.72" y="39.6" width="1.92" height="14.4" rx="1" fill="#3d3935"/>
