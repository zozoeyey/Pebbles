<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .line { animation: drawline 3.2s ease-in-out infinite; }
  @keyframes drawline { 0% { stroke-dashoffset: 200;} 70%,100% { stroke-dashoffset: 0;} }
  .mn1 { animation: nb 1.4s ease-in-out infinite; }
  .mn2 { animation: nb 1.4s ease-in-out .5s infinite; }
  @keyframes nb { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

