<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .breathe { animation: br 4s ease-in-out infinite; }
  @keyframes br { 0%,100% { transform: scale(1);} 45% { transform: scale(1.12);} }
  .w1,.w2 { animation: wv 4s ease-in-out infinite; opacity:0; }
  .w2 { animation-delay: .3s; }
  @keyframes wv { 0%,40% {opacity:0;} 55%,80% {opacity:1;} 100% {opacity:0;} }
  .mini { display:none; }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
