<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .f { animation: swap 3s ease-in-out infinite; }
  .sad { animation-delay: 1.5s; opacity: 0; }
  @keyframes swap { 0%,45% { opacity: 1; } 50%,95% { opacity: 0; } 100% { opacity: 1; } }

</style>
