<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .g1 { animation: in1 3.2s ease-out infinite; }
  .g2 { animation: in2 3.2s ease-out infinite; }
  .g3 { animation: in3 3.2s ease-out infinite; }
  .g4 { animation: in4 3.2s ease-out infinite; }
  @keyframes in1 { 0% { transform: translateY(-30px); opacity:0;} 18%,85% { transform: translateY(0); opacity:1;} 100% { transform: translateY(0); opacity:1;} }
  @keyframes in2 { 0%,8% { transform: translateX(30px); opacity:0;} 26%,85% { transform: translateX(0); opacity:1;} 100% { transform: translateX(0); opacity:1;} }
  @keyframes in3 { 0%,16% { transform: translateY(30px); opacity:0;} 34%,85% { transform: translateY(0); opacity:1;} 100% { transform: translateY(0); opacity:1;} }
  @keyframes in4 { 0%,24% { transform: translateX(-30px); opacity:0;} 42%,85% { transform: translateX(0); opacity:1;} 100% { transform: translateX(0); opacity:1;} }

</style>
