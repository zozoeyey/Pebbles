<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .fast { animation: fj .5s ease-in-out infinite; }
  @keyframes fj { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }
  .slowN { animation: sj 2.4s ease-in-out infinite; }
  @keyframes sj { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }
  .calmline { animation: sway 2.4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: translateY(0);} 50% { transform: translateY(5px);} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  <rect x="36" y="70" width="128" height="92" rx="6" fill="#fff" stroke="#3d3935" stroke-width="2"/>
  <path class="calmline" d="M48 116 q26 14 52 0 q26 -14 52 0" stroke="#9CD3F8" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <g class="fast" style="transform-box:fill-box;transform-origin:center">
    <ellipse cx="60" cy="54" rx="5" ry="4" fill="#F9A3C4"/>
    <rect x="63.4" y="36" width="2.4" height="18" rx="1" fill="#F9A3C4"/>
    <path d="M63.4 36 q7 -2 9 4 l0 4 q-2 -6 -9 -4 z" fill="#F9A3C4"/>
  </g>
  
  <g class="slowN" style="transform-box:fill-box;transform-origin:center">
    <ellipse cx="140" cy="54" rx="5" ry="4" fill="#9CD3F8"/>
    <rect x="143.4" y="36" width="2.4" height="18" rx="1" fill="#9CD3F8"/>
    <path d="M143.4 36 q7 -2 9 4 l0 4 q-2 -6 -9 -4 z" fill="#9CD3F8"/>
  </g>

</svg>