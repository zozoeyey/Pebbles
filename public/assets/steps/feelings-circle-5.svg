<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .growb { animation: gb 3.6s ease-in-out infinite; }
  @keyframes gb { 0% { transform: scale(.7); opacity:.4;} 45%,80% { transform: scale(1); opacity:1;} 100% { transform: scale(.7); opacity:.4;} }
  .listener { animation: nod 1.8s ease-in-out infinite; }
  @keyframes nod { 0%,100% { transform: rotate(0);} 50% { transform: rotate(7deg);} }

</style>
