   <path d="M104.70588235294117 101.8 q3.764705882352941 -4.705882352941177 7.529411764705882 0" stroke="#3d3935" stroke-width="2.447058823529412" fill="none" stroke-linecap="round"/><path d="M94.3529411764706 113.84 q5.647058823529411 5.647058823529411 11.294117647058822 0" stroke="#3d3935" stroke-width="2.2588235294117647" fill="none" stroke-linecap="round"/>
