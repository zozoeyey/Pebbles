<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .ring { animation: grow 3s ease-in-out infinite; }
  @keyframes grow { 0%,100% { transform: scale(.85); opacity:.5;} 50% { transform: scale(1.05); opacity:1;} }
  .stepin { animation: hopin 3s ease-in-out infinite; }
  @keyframes hopin { 0%,100% { transform: translateY(-4px);} 50% { transform: translateY(4px);} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  <ellipse class="ring" cx="100" cy="140" rx="52" ry="20" fill="none" stroke="#3d3935" stroke-width="2.6" stroke-dasharray="8 8"/>
  
  <g class="stepin" style="transform-box:fill-box;transform-origin:center">
    <ellipse cx="100" cy="106" rx="32" ry="28" fill="#d6e475"/>
