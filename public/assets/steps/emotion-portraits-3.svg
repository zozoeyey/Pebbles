  <g class="pf p2"><ellipse cx="91.9" cy="94" rx="2.8800000000000003" ry="4.5" fill="#3d3935"/>
   <ellipse cx="108.1" cy="94" rx="2.8800000000000003" ry="4.5" fill="#3d3935"/></g>
  <path class="pf p3" d="M90 112 q10 8 20 0" stroke="#3d3935" stroke-width="2.6" fill="none" stroke-linecap="round"/>

