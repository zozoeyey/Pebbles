<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .p1 { stroke-dasharray: 164; stroke-dashoffset: 164; animation: circ 4.2s ease-in-out infinite; }
  @keyframes circ { 0% { stroke-dashoffset: 164;} 35%,100% { stroke-dashoffset: 0;} }
  .p2 { animation: pop2 4.2s ease-in-out infinite; opacity:0; }
  @keyframes pop2 { 0%,38% {opacity:0;} 48%,100% {opacity:1;} }
  .p3 { animation: pop3 4.2s ease-in-out infinite; opacity:0; }
  @keyframes pop3 { 0%,58% {opacity:0;} 68%,100% {opacity:1;} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

