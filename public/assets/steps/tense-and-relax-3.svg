  <rect x="154" y="70" width="12" height="80" rx="4" fill="#c9a36b"/>
  <line x1="34" y1="88" x2="166" y2="88" stroke="#c9a36b" stroke-width="7"/>
  <line x1="34" y1="126" x2="166" y2="126" stroke="#c9a36b" stroke-width="7"/>
  
  <g class="squeeze" style="transform-box:fill-box;transform-origin:center">
    <ellipse cx="100" cy="108" rx="36" ry="32" fill="#d6e475"/>
    <ellipse cx="90.47058823529412" cy="103.2" rx="3.3882352941176475" ry="5.294117647058823" fill="#3d3935"/>
   <ellipse cx="109.52941176470588" cy="103.2" rx="3.3882352941176475" ry="5.294117647058823" fill="#3d3935"/>
  </g>

</svg>