<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .bulbg { animation: glow 2.8s ease-in-out infinite; }
  @keyframes glow { 0%,100% { transform: scale(.94); opacity:.75;} 50% { transform: scale(1.05); opacity:1;} }
  .ray { animation: rayp 2.8s ease-in-out infinite; }
  .ry1 { animation-delay: .2s; } .ry2 { animation-delay: .4s; }
  @keyframes rayp { 0%,100% { opacity:.2;} 50% { opacity:1;} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  <g class="bulbg">
    <circle cx="100" cy="86" r="24" fill="#FDD15E"/>
    <rect x="92" y="108" width="16" height="10" rx="3" fill="#b7b2aa"/>
    <rect x="94" y="118" width="12" height="5" rx="2.5" fill="#b7b2aa"/>
  </g>
  <line class="ray ry0" x1="73.4" y1="73.4" x2="62" y2="68" stroke="#FDD15E" stroke-width="4" stroke-linecap="round"/><line class="ray ry1" x1="126.6" y1="73.4" x2="138" y2="68" stroke="#FDD15E" stroke-width="4" stroke-linecap="round"/><line class="ray ry2" x1="100" y1="56.6" x2="100" y2="44" stroke="#FDD15E" stroke-width="4" stroke-linecap="round"/>
  
  <g>
    <rect x="52" y="140" width="96" height="26" rx="13" fill="#fff" stroke="#3d3935" stroke-width="1.6"/>
    <path d="M76 166 l4 8 l6 -8 z" fill="#fff" stroke="#3d3935" stroke-width="1.6"/>
    <text x="100" y="156.96" font-family="Montserrat, sans-serif" font-weight="700" font-size="11" fill="#3d3935" text-anchor="middle">snack @ 4:30</text>
  </g>

</svg>