<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .wig { animation: wg .5s ease-in-out infinite; }
  @keyframes wg { 0%,100% { transform: rotate(-8deg) translateX(-4px);} 50% { transform: rotate(8deg) translateX(4px);} }
  .zz { animation: zp .5s ease-in-out infinite; }
  .z2 { animation-delay: .25s; }
  @keyframes zp { 0%,100% { opacity:.3;} 50% { opacity:1;} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
  <g class="wig" style="transform-box:fill-box;transform-origin:center">
    <ellipse cx="100" cy="122" rx="36" ry="32" fill="#F9A3C4"/>
    <path d="M86.23529411764706 117.2 q4.235294117647059 -5.294117647058823 8.470588235294118 0" stroke="#3d3935" stroke-width="2.7529411764705882" fill="none" stroke-linecap="round"/>
   <path d="M105.29411764705883 117.2 q4.235294117647059 -5.294117647058823 8.470588235294118 0" stroke="#3d3935" stroke-width="2.7529411764705882" fill="none" stroke-linecap="round"/><path d="M93.6470588235294 130.96 q6.352941176470589 6.352941176470589 12.705882352941178 0" stroke="#3d3935" stroke-width="2.541176470588235" fill="none" stroke-linecap="round"/>
  </g>
  <path class="zz z1" d="M42 96 q6 -8 0 -16 q-6 -8 0 -16" stroke="#3d3935" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path class="zz z2" d="M158 96 q6 -8 0 -16 q-6 -8 0 -16" stroke="#3d3935" stroke-width="2.6" fill="none" stroke-linecap="round"/>

</svg>