  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .sniffer { animation: lean 4s ease-in-out infinite; }
  @keyframes lean { 0%,100% { transform: translateX(0) rotate(0);} 45%,65% { transform: translateX(-14px) rotate(-8deg);} }
  .scent { animation: rise 4s ease-in-out infinite; opacity:0; }
  .s2 { animation-delay: .35s; }
  @keyframes rise { 0%,30% { opacity:0; transform: translateY(4px);} 50%,70% { opacity:1; transform: translateY(-6px);} 90%,100% { opacity:0; transform: translateY(-14px);} }

</style>
