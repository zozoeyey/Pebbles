<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .box { animation: slide 2.4s ease-in-out infinite; }
  @keyframes slide { 0%,15% { transform: translateX(0);} 60%,100% { transform: translateX(26px);} }
  .push { animation: fadecycle 2.4s ease-in-out infinite; }
  @keyframes fadecycle { 0%,15% {opacity:1;} 60%,100% {opacity:0;} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
  <g class="" style="transform-box:fill-box;transform-origin:center">
    <ellipse cx="74" cy="120" rx="34" ry="30" fill="#9CD3F8"/>
    <ellipse cx="65" cy="115.5" rx="3.2" ry="5" fill="#3d3935"/>
   <ellipse cx="83" cy="115.5" rx="3.2" ry="5" fill="#3d3935"/>
  </g>
  <g class="box">
    <rect x="118" y="104" width="34" height="30" rx="5" fill="#FDD15E" stroke="#3d3935" stroke-width="2"/>
    <line x1="118" y1="116" x2="152" y2="116" stroke="#3d3935" stroke-width="2"/>
  </g>
  <g class="push" style="transform-box:fill-box;transform-origin:center">
    <line x1="128" y1="90" x2="158" y2="90" stroke="#3d3935" stroke-width="3" stroke-linecap="round"/>
    <path d="M158 90 L150.10175694298664 94.31482984743782 M158 90 L150.10175694298664 85.68517015256218" stroke="#3d3935" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

</svg>