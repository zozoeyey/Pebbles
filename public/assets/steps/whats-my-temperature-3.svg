<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .pointer { animation: pt 3s ease-in-out infinite; }
  @keyframes pt { 0%,100% { transform: translateY(28px);} 50% { transform: translateY(-24px);} }
  .thermo-fill { animation: tf 3s ease-in-out infinite; }
  @keyframes tf { 0%,100% { transform: scaleY(.25);} 50% { transform: scaleY(.8);} }

</style>
