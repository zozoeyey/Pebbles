  .tw2 { animation: tw 1.6s .8s ease-in-out infinite; }
  .zz { animation: zfloat 2.6s ease-in-out infinite; }
  .zb { animation-delay: .5s; }
  @keyframes zfloat { 0% { opacity:0; transform: translateY(4px);} 40% { opacity:1;} 100% { opacity:0; transform: translateY(-10px);} }

</style>
