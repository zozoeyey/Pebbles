<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .sigher { animation: sig 4.4s ease-in-out infinite; }
  @keyframes sig { 0% { transform: scale(1);} 30% { transform: scale(1.1);} 75%,100% { transform: scale(.96);} }
  .ah { animation: drift 4.4s ease-out infinite; opacity:0; }
  .a2 { animation-delay: .3s; } .a3 { animation-delay: .6s; }
  @keyframes drift { 0%,30% { opacity:0; transform: translate(0,0);} 45% { opacity:1;} 90%,100% { opacity:0; transform: translate(12px,-12px);} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
