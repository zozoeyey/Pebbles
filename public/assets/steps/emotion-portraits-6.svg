<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .hang { animation: sway 3.4s ease-in-out infinite; }
  .h2 { animation-delay: .5s; } .h3 { animation-delay: 1s; }
  @keyframes sway { 0%,100% { transform: rotate(-3deg);} 50% { transform: rotate(3deg);} }

</style>
