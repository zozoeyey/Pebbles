<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .dance { animation: bop .9s ease-in-out infinite; }
  @keyframes bop { 0%,100% { transform: translateY(0) rotate(-6deg);} 50% { transform: translateY(-14px) rotate(6deg);} }
  .n1 { animation: float 1.8s ease-in-out infinite; }
  .n2 { animation: float 1.8s ease-in-out .4s infinite; }
  .n3 { animation: float 1.8s ease-in-out .9s infinite; }
  @keyframes float { 0% { transform: translateY(6px); opacity:0;} 30% {opacity:1;} 100% { transform: translateY(-14px); opacity:0;} }

</style>
