<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .deflate { animation: def 4.5s ease-in-out infinite; }
  @keyframes def { 0%,15% { transform: scale(1.15);} 70%,100% { transform: scale(.5);} }
  .belly2 { animation: bl2 4.5s ease-in-out infinite; }
  @keyframes bl2 { 0%,15% { transform: scale(1.1);} 70%,100% { transform: scale(1);} }
  .puff { animation: pf 4.5s ease-in-out infinite; opacity:0; }
  .pf2 { animation-delay: .3s; }
  @keyframes pf { 0%,20% {opacity:0;} 35%,60% {opacity:1; transform: translateX(6px);} 80%,100% {opacity:0;} }

</style>
