<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .calm { animation: cb 5s ease-in-out infinite; }
  @keyframes cb { 0%,100% { transform: scale(.95);} 50% { transform: scale(1.07);} }
  .dream1 { animation: dg 5s ease-in-out infinite; }
  @keyframes dg { 0%,100% { transform: scale(.5); opacity:.4;} 50%,70% { transform: scale(1); opacity:1;} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
