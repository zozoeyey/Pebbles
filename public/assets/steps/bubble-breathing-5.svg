<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .panel { animation: hl 3s ease-in-out infinite; }
  .p2 { animation-delay: 1.5s; }
  @keyframes hl { 0%,40%,100% { opacity:.35;} 55%,85% { opacity:1;} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  <g class="panel p1">
    <circle cx="60" cy="96" r="16" fill="none" stroke="#9CD3F8" stroke-width="2.6" stroke-dasharray="4 6"/>
    <text x="60" y="140" font-family="Montserrat,sans-serif" font-weight="700" font-size="12" fill="#3d3935" text-anchor="middle">fast?</text>
  </g>
  <g class="panel p2">
    <circle cx="140" cy="92" r="26" fill="none" stroke="#9CD3F8" stroke-width="3"/>
    <text x="140" y="140" font-family="Montserrat,sans-serif" font-weight="700" font-size="12" fill="#3d3935" text-anchor="middle">slow?</text>
  </g>
  
  <g>
    <rect x="72" y="152" width="56" height="24" rx="12" fill="#fff" stroke="#3d3935" stroke-width="1.6"/>
    <path d="M86 176 l4 8 l6 -8 z" fill="#fff" stroke="#3d3935" stroke-width="1.6"/>
    <text x="100" y="169.04" font-family="Montserrat, sans-serif" font-weight="700" font-size="14" fill="#3d3935" text-anchor="middle">?</text>
  </g>

</svg>