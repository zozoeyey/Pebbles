<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .press { animation: pr 2.6s ease-in-out infinite; }
  @keyframes pr { 0%,15% { transform: translateY(0);} 40%,60% { transform: translateY(7px) scaleY(.94);} 85%,100% { transform: translateY(0);} }
  .foot { animation: ft 2.6s ease-in-out infinite; }
  @keyframes ft { 0%,15% { transform: translateY(0);} 40%,60% { transform: translateY(3px);} 85%,100% { transform: translateY(0);} }
  .down { animation: dn 2.6s ease-in-out infinite; }
  @keyframes dn { 0%,15% { opacity:.15;} 40%,60% { opacity:1; transform: translateY(3px);} 85%,100% { opacity:.15;} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

