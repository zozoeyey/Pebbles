<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .fill { animation: inflate 4.5s ease-in-out infinite; }
  @keyframes inflate { 0% { transform: scale(.55);} 45%,60% { transform: scale(1.15);} 100% { transform: scale(.55);} }
  .belly { animation: bl 4.5s ease-in-out infinite; }
  @keyframes bl { 0%,100% { transform: scale(1);} 45%,60% { transform: scale(1.1);} }
  .inA { animation: ia 4.5s ease-in-out infinite; }
  @keyframes ia { 0%,45% { opacity:1;} 60%,100% { opacity:.15;} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
