<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .guesser { animation: tilt 2.4s ease-in-out infinite; }
  @keyframes tilt { 0%,100% { transform: rotate(-5deg);} 50% { transform: rotate(5deg);} }
  .q { animation: qp 2.4s ease-in-out infinite; opacity:.2; }
  .q2 { animation-delay: .4s; } .q3 { animation-delay: .8s; }
  @keyframes qp { 0%,100% { opacity:.2; transform: translateY(0);} 40% { opacity:1; transform: translateY(-6px);} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
  <g class="guesser" style="transform-box:fill-box;transform-origin:center">
    <ellipse cx="100" cy="130" rx="34" ry="30" fill="#d6e475"/>
    <ellipse cx="91" cy="125.5" rx="3.2" ry="5" fill="#3d3935"/>
   <ellipse cx="109" cy="125.5" rx="3.2" ry="5" fill="#3d3935"/>
  </g>
  <text class="q q1" x="56" y="72" font-family="Montserrat,sans-serif" font-weight="800" font-size="24" fill="#3d3935">?</text>
  <text class="q q2" x="96" y="56" font-family="Montserrat,sans-serif" font-weight="800" font-size="30" fill="#3d3935">?</text>
  <text class="q q3" x="140" y="72" font-family="Montserrat,sans-serif" font-weight="800" font-size="24" fill="#3d3935">?</text>

</svg>