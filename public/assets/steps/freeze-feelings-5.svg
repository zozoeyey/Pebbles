<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .freezer { animation: frz 3s ease-in-out infinite; }
  @keyframes frz {
    0% { transform: translateY(0) rotate(-7deg);} 10% { transform: translateY(-10px) rotate(7deg);}
    20% { transform: translateY(0) rotate(-7deg);} 30% { transform: translateY(-10px) rotate(5deg);}
    38%,100% { transform: translateY(0) rotate(0deg);} }
  .bang { opacity:0; animation: bang 3s ease-out infinite; }
  @keyframes bang { 0%,34% {opacity:0; transform: scale(.4);} 42%,80% {opacity:1; transform: scale(1);} 100% {opacity:0;} }
  .tw { animation-duration: 3s; }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
  <g class="freezer" style="transform-box:fill-box;transform-origin:center">
    <ellipse cx="100" cy="128" rx="36" ry="32" fill="#F9A3C4"/>
    <ellipse cx="90.47058823529412" cy="123.2" rx="3.3882352941176475" ry="5.294117647058823" fill="#3d3935"/>
   <ellipse cx="109.52941176470588" cy="123.2" rx="3.3882352941176475" ry="5.294117647058823" fill="#3d3935"/>
  </g>
  <text class="bang" x="146" y="76" font-family="Montserrat,sans-serif" font-weight="800" font-size="30" fill="#3d3935">!</text>
  
  <path class="tw" style="transform-box:fill-box;transform-origin:center"
    d="M56 78 Q57.2 82.8 62 84 Q57.2 85.2 56 90 Q54.8 85.2 50 84 Q54.8 82.8 56 78 Z" fill="#FDD15E"/>
  
  <path class="tw" style="transform-box:fill-box;transform-origin:center"
    d="M150 115 Q151 119 155 120 Q151 121 150 125 Q149 121 145 120 Q149 119 150 115 Z" fill="#9CD3F8"/>

</svg>