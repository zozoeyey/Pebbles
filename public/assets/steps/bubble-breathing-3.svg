<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<style>
  * { transform-box: fill-box; }
  .tw { animation: tw 1.6s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .15; transform: scale(.6);} 50% { opacity: 1; transform: scale(1);} }

  .inhale { animation: inh 4s ease-in-out infinite; }
  @keyframes inh { 0%,100% { transform: scale(.94);} 50%,65% { transform: scale(1.12);} }
  .na1,.na2 { animation: naf 4s ease-in-out infinite; }
  @keyframes naf { 0% { opacity:.15;} 35%,60% { opacity:1;} 80%,100% { opacity:.15;} }

</style>
<circle cx="100" cy="104" r="88" fill="#FAF3E6"/>

  
  <g class="inhale" style="transform-box:fill-box;transform-origin:center">
    <ellipse cx="100" cy="118" rx="36" ry="32" fill="#d6e475"/>
    <ellipse cx="90.47058823529412" cy="113.2" rx="3.3882352941176475" ry="5.294117647058823" fill="#3d3935"/>
   <ellipse cx="109.52941176470588" cy="113.2" rx="3.3882352941176475" ry="5.294117647058823" fill="#3d3935"/>
  </g>
  <g class="na1" style="transform-box:fill-box;transform-origin:center">
    <line x1="48" y1="66" x2="74" y2="88" stroke="#3d3935" stroke-width="3" stroke-linecap="round"/>
    <path d="M74 88 L65.18345870856504 86.1920731053435 M74 88 L70.75772043496332 79.6043092468728" stroke="#3d3935" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <g class="na2" style="transform-box:fill-box;transform-origin:center">
    <line x1="152" y1="66" x2="126" y2="88" stroke="#3d3935" stroke-width="3" stroke-linecap="round"/>
    <path d="M126 88 L129.24227956503668 79.6043092468728 M126 88 L134.81654129143496 86.1920731053435" stroke="#3d3935" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <text x="100" y="180" font-family="Montserrat,sans-serif" font-weight="700" font-size="12" fill="#3d3935" text-anchor="middle">through your nose…</text>

</svg>